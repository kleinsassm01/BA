[project]
name = "nqs-nn-repr"
version = "0.2.0"
description = "NQS with centered cernal alignment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "jax[cuda13]==0.7.2",
    "matplotlib>=3.10.8",
    "netket==3.21.0",
    "scienceplots>=2.2.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
nqs-train = "nqs_cka.app.cli:main"
nqs-plot = "nqs.app.cli:plot_main"

[tool.setuptools]
py-modules = ["nqs_cka"]

[tool.uv]
package = true
